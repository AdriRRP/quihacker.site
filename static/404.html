<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>404 · Quihacker's Lab</title>
  <style>
    :root {
      color-scheme: light dark;
      --background: #f2ebdf;
      --surface: #fcfaf5;
      --text: #2d241d;
      --muted: #6e5f52;
      --accent: #745b43;
      --border: #c9b8a3;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: #1d1f20;
        --surface: #262b2c;
        --text: #dbe6de;
        --muted: #a9b9b0;
        --accent: #9bcabb;
        --border: #556766;
      }
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 2rem;
      background: var(--background);
      color: var(--text);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(42rem, 100%);
      padding: clamp(2rem, 7vw, 4rem);
      border: 1px solid var(--border);
      border-radius: 1rem;
      background: var(--surface);
      box-shadow: 0 1rem 3rem rgb(0 0 0 / 10%);
    }

    .status {
      margin: 0;
      color: var(--accent);
      font: 700 clamp(4rem, 18vw, 8rem) / 0.9 ui-monospace, "SFMono-Regular", Consolas, monospace;
      letter-spacing: -0.08em;
    }

    h1 {
      margin: 1.5rem 0 0.75rem;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
    }

    p {
      margin: 0.5rem 0;
      color: var(--muted);
      line-height: 1.65;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      margin-top: 2rem;
    }

    a {
      padding: 0.7rem 1rem;
      border: 1px solid var(--border);
      border-radius: 0.55rem;
      color: var(--text);
      font-weight: 650;
      text-decoration: none;
    }

    a:hover,
    a:focus-visible {
      border-color: var(--accent);
      color: var(--accent);
      outline: none;
    }
  </style>
</head>
<body>
  <main>
    <p class="status" aria-hidden="true">404</p>
    <h1>Página no encontrada</h1>
    <p>La dirección no existe o el contenido se ha movido.</p>
    <p lang="en">This address does not exist or the content has moved.</p>
    <nav aria-label="Elegir idioma · Choose language">
      <a href="/es/" hreflang="es">Ir al inicio en español</a>
      <a href="/en/" hreflang="en" lang="en">Go to the English home page</a>
    </nav>
  </main>
</body>
</html>

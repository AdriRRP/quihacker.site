name: Bug report
description: Report a reproducible site, content, or build problem.
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: >-
        Do not disclose vulnerabilities or sensitive data here. Use private
        vulnerability reporting as described in SECURITY.md.
  - type: input
    id: url
    attributes:
      label: Affected URL or file
      placeholder: https://quihacker.site/es/…
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include exact error messages when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or build environment
      placeholder: Firefox 143 / Hugo 0.164.0 / Ubuntu 24.04

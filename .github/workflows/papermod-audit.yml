name: PaperMod upstream audit

on:
  schedule:
    - cron: "41 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: papermod-upstream-audit
  cancel-in-progress: true

jobs:
  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check upstream revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/check-papermod-upstream.sh

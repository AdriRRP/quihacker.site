title = "Quihacker's Lab"
baseURL = 'https://quihacker.site/'
locale = 'es-ES'
theme = 'PaperMod'

# Idioma por defecto y URLs localizadas (/es/, /en/)
defaultContentLanguage = 'es'
defaultContentLanguageInSubdir = true
enableRobotsTXT = true

[services.rss]
limit = 20

[taxonomies]
tag    = "tags"
series = "series"

[outputs]
home     = ["HTML", "RSS", "JSON"]   # JSON es imprescindible para la búsqueda
section  = ["HTML", "RSS"]
taxonomy = ["HTML", "RSS"]
term     = ["HTML", "RSS"]
